<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>

    <link
      rel="stylesheet"
      href="styles/index.css"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__image"></div>

      <h2 class="card__name">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>

      <p class="card__code">Product code: 195434</p>

      <ul class="card__rate">
        <li class="card__rate-star">
          <img
            src="styles/images/star-active.svg"
            alt="star"
          />
        </li>

        <li class="card__rate-star">
          <img
            src="styles/images/star-active.svg"
            alt="star"
          />
        </li>

        <li class="card__rate-star">
          <img
            src="styles/images/star-active.svg"
            alt="star"
          />
        </li>

        <li class="card__rate-star">
          <img
            src="styles/images/star-active.svg"
            alt="star"
          />
        </li>

        <li class="card__rate-star">
          <img
            src="styles/images/star.svg"
            alt="star"
          />
        </li>

        <li class="card__rate-review">Reviews: 5</li>
      </ul>

      <div class="card__price">
        <div class="card__price-label">Price:</div>

        <div class="card__price-value">$2,199</div>
      </div>

      <button
        class="card__button"
        type="button"
        data-qa="hover"
      >
        <a
          class="card__button-link"
          href="#BUY"
        >
          BUY
        </a>
      </button>
    </div>
  </body>
</html>
